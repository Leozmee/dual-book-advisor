<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dual Book Advisor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📚 Dual Book Advisor</h1>
            <div class="space-x-4">
                <a href="/" class="hover:text-indigo-200">Home</a>
                <a href="/chat/" class="hover:text-indigo-200">Chat</a>
                <a href="/admin/" class="hover:text-indigo-200">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white p-4 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 Dual Book Advisor - AI-Powered Book Recommendations</p>
        </div>
    </footer>
</body>
</html>
