<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dual Book Advisor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <!-- Audio global pour les boutons -->
    <script>
        // Variables globales pour l'audio des boutons
        let buttonAudioContext;
        let isButtonAudioEnabled = false;
        
        // Fonction pour initialiser l'audio des boutons
        function initializeButtonAudio() {
            try {
                buttonAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                if (buttonAudioContext.state === 'suspended') {
                    buttonAudioContext.resume();
                }
                
                isButtonAudioEnabled = true;
                console.log('🎵 Audio boutons initialisé !');
                return true;
            } catch (error) {
                console.log('Erreur audio boutons:', error);
                return false;
            }
        }
        
        // Fonction pour créer un son de bulle pop (style Apple/Nintendo)
        function createBubblePopSound() {
            if (!isButtonAudioEnabled) {
                return;
            }
            
            try {
                if (buttonAudioContext.state === 'suspended') {
                    buttonAudioContext.resume().then(() => {
                        playBubblePop();
                    });
                } else {
                    playBubblePop();
                }
            } catch (error) {
                console.log('Erreur bulle pop:', error);
            }
        }
        
        // Fonction pour jouer le son de bulle
        function playBubblePop() {
            try {
                const now = buttonAudioContext.currentTime;
                
                // Créer deux oscillateurs pour un son plus riche
                const osc1 = buttonAudioContext.createOscillator();
                const osc2 = buttonAudioContext.createOscillator();
                const gain1 = buttonAudioContext.createGain();
                const gain2 = buttonAudioContext.createGain();
                
                osc1.connect(gain1);
                osc2.connect(gain2);
                gain1.connect(buttonAudioContext.destination);
                gain2.connect(buttonAudioContext.destination);
                
                // Configuration du son principal (bulle)
                osc1.frequency.setValueAtTime(800, now);
                osc1.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                osc1.type = 'sine';
                
                // Configuration du son secondaire (pop)
                osc2.frequency.setValueAtTime(1200, now);
                osc2.frequency.exponentialRampToValueAtTime(400, now + 0.08);
                osc2.type = 'triangle';
                
                // Envelope bulle (attaque rapide, decay doux) - Volume encore plus réduit
                gain1.gain.setValueAtTime(0, now);
                gain1.gain.linearRampToValueAtTime(0.05, now + 0.01);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                
                // Envelope pop (plus court et punchy) - Volume encore plus réduit
                gain2.gain.setValueAtTime(0, now);
                gain2.gain.linearRampToValueAtTime(0.025, now + 0.005);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.12);
                osc2.stop(now + 0.08);
                
                console.log('🫧 Bulle pop !');
            } catch (error) {
                console.log('Erreur playBubblePop:', error);
            }
        }
        
        // Initialisation au chargement
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Initialisation audio boutons...');
            
            // Activer l'audio au premier clic (SANS son test)
            const activateButtonAudio = function() {
                if (!isButtonAudioEnabled) {
                    console.log('👆 Activation audio boutons...');
                    initializeButtonAudio();
                    // PAS de son test ici pour éviter le conflit
                }
            };
            
            // Écouter les interactions
            document.addEventListener('click', activateButtonAudio, { once: true });
            document.addEventListener('touchstart', activateButtonAudio, { once: true });
            
            // Ajouter le son aux liens de navigation
            const navLinks = document.querySelectorAll('nav a');
            console.log('🔗 Liens navigation trouvés:', navLinks.length);
            
            navLinks.forEach((link, index) => {
                link.addEventListener('click', function(e) {
                    console.log('📱 Clic sur lien navigation', index);
                    createBubblePopSound();
                });
            });
            
            // Ajouter le son à tous les boutons
            const buttons = document.querySelectorAll('button');
            console.log('🔘 Boutons trouvés:', buttons.length);
            
            buttons.forEach((button, index) => {
                button.addEventListener('click', function(e) {
                    console.log('🔘 Clic sur bouton', index);
                    createBubblePopSound();
                });
            });
            
            // Ajouter le son aux liens généraux
            const allLinks = document.querySelectorAll('a');
            console.log('🔗 Tous liens trouvés:', allLinks.length);
            
            allLinks.forEach((link, index) => {
                link.addEventListener('click', function(e) {
                    console.log('🔗 Clic sur lien', index);
                    createBubblePopSound();
                });
            });
        });
    </script>
    
    <!-- Script pour masquer/afficher navbar et footer au scroll -->
    <script>
        let lastScrollTop = 0;
        let navbar = null;
        let footer = null;
        let isNavbarVisible = true;
        let isFooterVisible = true;
        
        document.addEventListener('DOMContentLoaded', function() {
            navbar = document.querySelector('nav');
            footer = document.querySelector('footer');
            
            // Ajouter les classes de transition
            if (navbar) {
                navbar.style.transition = 'transform 0.3s ease-in-out';
            }
            if (footer) {
                footer.style.transition = 'transform 0.3s ease-in-out';
            }
            
            // Écouter le scroll
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                // Masquer/afficher navbar
                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    // Scroll vers le bas - masquer navbar
                    if (isNavbarVisible && navbar) {
                        navbar.style.transform = 'translateY(-100%)';
                        isNavbarVisible = false;
                    }
                } else {
                    // Scroll vers le haut - afficher navbar
                    if (!isNavbarVisible && navbar) {
                        navbar.style.transform = 'translateY(0)';
                        isNavbarVisible = true;
                    }
                }
                
                // Masquer/afficher footer
                const documentHeight = document.documentElement.scrollHeight;
                const windowHeight = window.innerHeight;
                const scrollBottom = scrollTop + windowHeight;
                const footerThreshold = documentHeight - windowHeight - 200;
                
                if (scrollTop > lastScrollTop && scrollTop > 100 && scrollTop < footerThreshold) {
                    // Scroll vers le bas - masquer footer
                    if (isFooterVisible && footer) {
                        footer.style.transform = 'translateY(100%)';
                        isFooterVisible = false;
                    }
                } else {
                    // Scroll vers le haut ou proche du bas - afficher footer
                    if (!isFooterVisible && footer) {
                        footer.style.transform = 'translateY(0)';
                        isFooterVisible = true;
                    }
                }
                
                lastScrollTop = scrollTop;
            });
        });
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#0f0f0f',
                        'dark-surface': '#1a1a1a',
                        'dark-elevated': '#2d2d2d',
                        'dark-border': '#3d3d3d',
                        'dark-text': '#e5e5e5',
                        'dark-muted': '#a0a0a0',
                        'accent-primary': '#10b981',
                        'accent-secondary': '#3b82f6',
                        'accent-purple': '#8b5cf6',
                        'accent-orange': '#f59e0b'
                    },
                    fontFamily: {
                        'inter': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-gentle': 'pulseGentle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        pulseGentle: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        },
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
